<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — Phoenix</title>
<link rel="stylesheet" href="css/main.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/supabase.js"></script>
<script src="js/utils.js"></script><script src="js/auth.js"></script></head>
<body class="auth-body"><div class="auth-card">
<h1>Phoenix</h1><p class="muted">ERP Made By RayanemiX — Purchasing &amp; Sourcing</p>
<div class="tabs"><button data-t="login" class="active">Connexion</button><button data-t="register">Inscription</button><button data-t="reset">Mot de passe oublié</button></div>
<form id="f-login"><input id="l-email" type="email" placeholder="Email" required><input id="l-pass" type="password" placeholder="Mot de passe" required><button class="btn">Se connecter</button></form>
<form id="f-register" hidden><input id="r-name" placeholder="Nom complet" required><input id="r-email" type="email" placeholder="Email" required><input id="r-pass" type="password" minlength="8" placeholder="Mot de passe (8 caractères min.)" required><button class="btn">Créer mon compte</button></form>
<form id="f-reset" hidden><input id="p-email" type="email" placeholder="Email" required><button class="btn">Envoyer le lien</button></form>
<form id="f-newpass" hidden><input id="n-pass" type="password" minlength="8" placeholder="Nouveau mot de passe" required><button class="btn">Enregistrer</button></form>
</div>
<script>
const forms = {login:'f-login',register:'f-register',reset:'f-reset'};
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
  Object.entries(forms).forEach(([k,id]) => document.getElementById(id).hidden = k !== b.dataset.t);
});
const run = (id, fn, ok) => document.getElementById(id).addEventListener('submit', async e => {
  e.preventDefault();
  try { await fn(); if (ok) Utils.toast(ok); } catch (err) { Utils.toast(err.message, 'err'); }
});
run('f-login', async () => { await Auth.login(document.getElementById('l-email').value, document.getElementById('l-pass').value); location.href = 'dashboard.html'; });
run('f-register', () => Auth.register(document.getElementById('r-email').value, document.getElementById('r-pass').value, document.getElementById('r-name').value), 'Compte créé. Vérifie ton email si la confirmation est activée.');
run('f-reset', () => Auth.resetPassword(document.getElementById('p-email').value), 'Email envoyé.');
run('f-newpass', async () => { await Auth.updatePassword(document.getElementById('n-pass').value); location.href = 'dashboard.html'; });
// Arrivée via le lien de réinitialisation
sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { Object.values(forms).forEach(id => document.getElementById(id).hidden = true); document.querySelector('.tabs').hidden = true; document.getElementById('f-newpass').hidden = false; } });
</script></body></html>
