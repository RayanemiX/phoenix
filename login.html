<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — Phoenix</title>
<link rel="stylesheet" href="css/main.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/supabase.js"></script>
<script src="js/utils.js"></script><script src="js/auth.js"></script></head>
<body class="auth-body"><div class="auth-card">
<img class="logo" src="assets/logo.png" alt="" onerror="this.remove()">
<h1>Phoenix</h1><p class="muted">ERP Made By RayanemiX — Purchasing &amp; Sourcing</p>
<div class="tabs"><button data-t="login" class="active">Connexion</button><button data-t="register">Inscription</button><button data-t="reset">Mot de passe oublié</button></div>
<div id="msg"></div>
<form id="f-login"><input id="l-email" type="email" placeholder="Email" required><input id="l-pass" type="password" placeholder="Mot de passe" required><button class="btn">Se connecter</button></form>
<form id="f-register" hidden><input id="r-name" placeholder="Nom complet" required><input id="r-email" type="email" placeholder="Email" required><input id="r-pass" type="password" minlength="8" placeholder="Mot de passe (8 caractères min.)" required><button class="btn">Créer mon compte</button></form>
<form id="f-reset" hidden><input id="p-email" type="email" placeholder="Email" required><button class="btn">Envoyer le lien</button></form>
<form id="f-newpass" hidden><input id="n-pass" type="password" minlength="8" placeholder="Nouveau mot de passe" required><button class="btn">Enregistrer</button></form>
</div>
<script>
const $ = id => document.getElementById(id);
const forms = { login: 'f-login', register: 'f-register', reset: 'f-reset' };

// Affiche un message animé (type : ok | err | info). resendEmail ajoute un bouton "Renvoyer".
function showMsg(text, type = 'info', resendEmail = null) {
  const box = $('msg'); box.innerHTML = '';
  if (!text) return;
  const d = document.createElement('div'); d.className = 'msg ' + type;
  d.innerHTML = `<span class="ic">${type === 'ok' ? '✓' : type === 'err' ? '!' : 'i'}</span><div></div>`;
  d.lastChild.textContent = text;
  if (resendEmail) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'link-btn'; b.textContent = "Renvoyer l'email";
    b.onclick = () => resend(resendEmail, b); d.lastChild.append(document.createElement('br'), b);
  }
  box.appendChild(d);
}
async function resend(email, btn) {
  btn.disabled = true;
  try { const { error } = await sb.auth.resend({ type: 'signup', email }); if (error) throw error; Utils.toast('Email renvoyé.'); }
  catch (e) { Utils.toast(Utils.translateError(e.message), 'err'); }
  let s = 30; const t = setInterval(() => { btn.textContent = `Renvoyer (${--s}s)`; if (s <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = "Renvoyer l'email"; } }, 1000);
}
function goDashboard(text) { Utils.showLoader(text); location.href = 'dashboard.html'; }

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
  Object.entries(forms).forEach(([k, id]) => $(id).hidden = k !== b.dataset.t);
  showMsg('');
});

// Branche un formulaire : bouton "en cours" + erreurs traduites.
function bind(formId, label, action) {
  const form = $(formId);
  form.addEventListener('submit', async e => {
    e.preventDefault(); showMsg('');
    await Utils.withLoading(form.querySelector('button.btn'), label, async () => {
      try { await action(); } catch (err) { showMsg(Utils.translateError(err.message), 'err'); }
    });
  });
}

bind('f-login', 'Connexion en cours…', async () => {
  await Auth.login($('l-email').value.trim(), $('l-pass').value);
  goDashboard('Connexion réussie, redirection…');
});
bind('f-register', 'Création du compte…', async () => {
  const email = $('r-email').value.trim();
  const data = await Auth.register(email, $('r-pass').value, $('r-name').value.trim());
  if (data.session) return goDashboard('Compte créé, redirection…');   // confirmation email désactivée
  if (data.user && data.user.identities && data.user.identities.length === 0)
    return showMsg('Un compte existe déjà avec cet email. Connecte-toi ou réinitialise ton mot de passe.', 'err');
  showMsg(`Email de confirmation envoyé à ${email}. Ouvre le lien reçu (vérifie aussi tes spams), puis reviens te connecter.`, 'ok', email);
});
bind('f-reset', 'Envoi en cours…', async () => {
  const email = $('p-email').value.trim();
  await Auth.resetPassword(email);
  showMsg(`Si un compte existe pour ${email}, un email de réinitialisation vient d'être envoyé.`, 'ok');
});
bind('f-newpass', 'Enregistrement…', async () => {
  await Auth.updatePassword($('n-pass').value);
  goDashboard('Mot de passe modifié, redirection…');
});

// Arrivée via le lien de réinitialisation
sb.auth.onAuthStateChange(ev => {
  if (ev === 'PASSWORD_RECOVERY') {
    Object.values(forms).forEach(id => $(id).hidden = true);
    document.querySelector('.tabs').hidden = true; $('f-newpass').hidden = false;
    showMsg('Choisis ton nouveau mot de passe.', 'info');
  }
});
</script></body></html>
